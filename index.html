<title>Prompt Architect</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,600;125,700;125,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  /* ---------- tokens: light is the base ---------- */
  :root {
    --ground:        #f4f3ee;
    --surface:       #fdfdfb;
    --surface-sunk:  #ecebe3;
    --border:        #dcd9cd;
    --border-strong: #c4c0af;
    --ink:           #211e19;
    --ink-2:         #5f584c;
    --ink-3:         #8b8371;
    --accent:        #2f49d1;
    --accent-ink:    #1c2f9c;
    --accent-soft:   #e5e8fb;
    --good:          #1f7a54;
    --warn:          #a4661a;
    --crit:          #bb3a2c;
    --focus:         #2f49d1;
    --shadow:        0 1px 2px rgba(30,27,20,.06), 0 8px 24px -12px rgba(30,27,20,.18);
    --maxread:       66ch;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:        #15141a;
      --surface:       #1e1d24;
      --surface-sunk:  #191820;
      --border:        #33313d;
      --border-strong: #494654;
      --ink:           #ece9e1;
      --ink-2:         #a49d8f;
      --ink-3:         #7c7566;
      --accent:        #8fa0ff;
      --accent-ink:    #b9c3ff;
      --accent-soft:   #23253a;
      --good:          #5fc79a;
      --warn:          #d69b53;
      --crit:          #e8897b;
      --focus:         #8fa0ff;
      --shadow:        0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ground:        #15141a;
    --surface:       #1e1d24;
    --surface-sunk:  #191820;
    --border:        #33313d;
    --border-strong: #494654;
    --ink:           #ece9e1;
    --ink-2:         #a49d8f;
    --ink-3:         #7c7566;
    --accent:        #8fa0ff;
    --accent-ink:    #b9c3ff;
    --accent-soft:   #23253a;
    --good:          #5fc79a;
    --warn:          #d69b53;
    --crit:          #e8897b;
    --focus:         #8fa0ff;
    --shadow:        0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 {
    font-family: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
    font-stretch: 125%;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: .01em;
    text-wrap: balance;
    margin: 0;
  }
  p { margin: 0; }
  a { color: var(--accent-ink); }
  button { font: inherit; color: inherit; }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 3px;
  }
  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- shell ---------- */
  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 clamp(16px, 4vw, 40px);
  }
  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 26px 0 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2rem);
  }
  .brand .tag {
    color: var(--ink-2);
    font-size: .9rem;
    margin-top: 4px;
    max-width: 52ch;
  }
  .brand .mark {
    display: inline-block;
    border: 1.5px solid var(--border-strong);
    border-bottom-width: 4px;
    border-radius: 4px;
    padding: 1px 8px;
    font-family: 'Archivo','Arial Narrow',sans-serif;
    font-stretch: 125%;
    font-weight: 800;
    letter-spacing: .04em;
    margin-right: 10px;
    font-size: .8em;
    transform: translateY(-2px);
  }
  .top-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  :root[data-theme="dark"] .btn.primary { color: #14131a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn.primary { color: #14131a; }
  }
  .btn.primary:hover { filter: brightness(1.06); border-color: var(--accent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-sunk); border-color: transparent; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  /* ---------- intro ---------- */
  .intro {
    padding: 36px 0 60px;
    display: grid;
    gap: 40px;
  }
  .intro-lede {
    font-size: clamp(1.05rem, 1rem + .5vw, 1.3rem);
    max-width: 60ch;
    color: var(--ink);
  }
  .intro-lede strong { color: var(--accent-ink); font-weight: 600; }
  .principles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .principle {
    background: var(--surface);
    padding: 18px 20px;
  }
  .principle .n {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .74rem;
    color: var(--accent-ink);
    letter-spacing: .1em;
  }
  .principle p {
    margin-top: 6px;
    font-size: .92rem;
    color: var(--ink-2);
  }
  .pick h2 {
    font-size: 1.05rem;
    margin-bottom: 4px;
  }
  .pick .sub { color: var(--ink-2); font-size: .9rem; margin-bottom: 18px; }
  .types {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
  }
  .type-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 16px 16px 18px;
    cursor: pointer;
    display: grid;
    gap: 6px;
    align-content: start;
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .type-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .type-card[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .type-card .t-name {
    font-family: 'Archivo','Arial Narrow',sans-serif;
    font-stretch: 125%;
    font-weight: 700;
    font-size: 1rem;
  }
  .type-card .t-blurb { font-size: .86rem; color: var(--ink-2); }
  .start-row {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .start-row .btn.primary { padding: 11px 22px; font-size: .95rem; }
  .start-hint { font-size: .84rem; color: var(--ink-3); }

  /* ---------- builder layout ---------- */
  .builder {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 40px;
    padding: 30px 0 140px;
    align-items: start;
  }
  nav.rail {
    position: sticky;
    top: 18px;
    display: grid;
    gap: 2px;
  }
  .rail-head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .7rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 4px 10px 8px;
  }
  .rail-item {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--ink-2);
    transition: background .1s, color .1s;
  }
  .rail-item:hover { background: var(--surface-sunk); }
  .rail-item[aria-current="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .rail-item .ri-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: var(--ink-3);
  }
  .rail-item[aria-current="true"] .ri-num { color: var(--accent-ink); }
  .rail-item .ri-title { font-size: .84rem; line-height: 1.3; }
  .ri-meter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .ri-meter.full { color: var(--good); }

  main.stage { min-width: 0; }
  .section-head { margin-bottom: 6px; }
  .section-head .eyebrow { display: block; margin-bottom: 8px; }
  .section-head h2 {
    font-size: clamp(1.3rem, 1.1rem + 1vw, 1.7rem);
  }
  .principle-note {
    margin: 16px 0 30px;
    padding: 13px 16px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: .9rem;
    color: var(--ink);
    max-width: var(--maxread);
  }

  .field { margin-bottom: 26px; max-width: var(--maxread); }
  .field > label {
    display: block;
    font-weight: 600;
    font-size: .98rem;
    margin-bottom: 3px;
  }
  .field .req {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .62rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--crit);
    margin-left: 8px;
    vertical-align: 1px;
  }
  .field .req.opt { color: var(--ink-3); }
  .field .help {
    font-size: .85rem;
    color: var(--ink-2);
    margin-bottom: 9px;
  }
  .field textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 11px 13px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: .95rem;
    line-height: 1.55;
  }
  .field textarea:focus { border-color: var(--accent); }
  .field textarea::placeholder { color: var(--ink-3); opacity: .8; }
  .field.filled textarea { border-color: var(--good); }

  .overlook {
    margin: 34px 0 0;
    max-width: var(--maxread);
    border: 1px dashed var(--border-strong);
    border-radius: 9px;
    padding: 14px 18px 16px;
    background: var(--surface-sunk);
  }
  .overlook h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-stretch: normal;
    font-weight: 600;
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 8px;
  }
  .overlook ul { margin: 0; padding-left: 18px; }
  .overlook li { font-size: .87rem; color: var(--ink-2); margin: 4px 0; }

  /* ---------- sticky footer ---------- */
  .footbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--ground);
    background: color-mix(in srgb, var(--ground) 90%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .footbar .inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px clamp(16px, 4vw, 40px);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .meter-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .meter-track {
    flex: 1;
    height: 7px;
    background: var(--surface-sunk);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    min-width: 80px;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .meter-fill.done { background: var(--good); }
  .meter-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .foot-nav { display: flex; gap: 8px; flex-shrink: 0; }

  /* ---------- output modal ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(20,18,14,.5);
    z-index: 40;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: clamp(0px, 4vh, 44px) clamp(0px, 4vw, 44px);
  }
  .modal {
    background: var(--ground);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: var(--shadow);
    width: min(920px, 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .modal header h2 { font-size: 1.15rem; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink-2);
  }
  .tab[aria-selected="true"] {
    background: var(--surface);
    border-color: var(--border-strong);
    color: var(--ink);
  }
  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    display: grid;
    gap: 16px;
  }
  .gaps {
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    background: var(--surface);
  }
  .gaps h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-stretch: normal;
    font-size: .74rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--warn);
    margin-bottom: 8px;
  }
  .gaps ul { margin: 0; padding-left: 18px; }
  .gaps li { font-size: .85rem; color: var(--ink-2); margin: 5px 0; }
  .gaps li b { color: var(--ink); font-weight: 600; }
  .gaps.clear { border-left-color: var(--good); }
  .gaps.clear h3 { color: var(--good); }

  .out-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    background: var(--surface);
    border: 0;
    padding: 6px 11px;
    font-size: .78rem;
    cursor: pointer;
    color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--border-strong); }

  pre.out {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 16px;
    overflow-x: auto;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: .82rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 46vh;
    overflow-y: auto;
    color: var(--ink);
  }
  .copied { color: var(--good); font-size: .8rem; font-family: 'IBM Plex Mono', monospace; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 860px) {
    .builder { grid-template-columns: 1fr; gap: 20px; }
    nav.rail {
      position: static;
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .rail-head { display: none; }
    .rail-item {
      grid-template-columns: auto auto;
      flex: 0 0 auto;
      gap: 6px;
    }
    .rail-item .ri-title {
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1><span class="mark">PA</span>Prompt Architect</h1>
      <p class="tag">A guided bench for writing the full instruction set an AI model needs — so you brief it once, not five times.</p>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="btnMethod" hidden>&#8592; Method</button>
      <button class="btn" id="btnTheme" aria-label="Toggle colour theme">Theme</button>
      <button class="btn" id="btnSave">Save draft</button>
      <button class="btn" id="btnLoad">Load</button>
      <button class="btn ghost" id="btnReset">Reset</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden />
    </div>
  </header>

  <div id="root"></div>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "prompt-architect:v1";

  /* =========================================================
     BUILD TYPES
     ========================================================= */
  var TYPES = [
    { id: "assistant", label: "Conversational assistant",
      blurb: "An ongoing chat persona — support bot, tutor, in-product copilot. You write its system prompt once; people talk to it many times." },
    { id: "agent", label: "Autonomous agent",
      blurb: "Pursues a goal over multiple steps, calls tools, and decides its own next action. Needs autonomy limits, budgets and stop conditions." },
    { id: "task", label: "Single-shot task",
      blurb: "One input in, one output out — summarise, extract, classify, rewrite, generate. No back-and-forth, no tools." },
    { id: "workflow", label: "Multi-step workflow",
      blurb: "A pipeline of stages, some model calls and some plain code. You are defining the model stages and how they hand off." }
  ];

  var PRINCIPLES = [
    "A model fills every gap you leave — with its guess, not yours. Name the boundaries explicitly.",
    "Show, don't only tell. One real example removes more ambiguity than a paragraph of description.",
    "State the anti-goals. “Never do X” carries as much weight as “do Y”.",
    "Define “done” before you start. It is the single biggest lever on how many rounds this takes.",
    "Write for a literal reader with no shared context and perfect memory. Assume nothing carries over.",
    "Keep the spec, not just the prompt. Iterate on the spec; regenerate the prompt from it."
  ];

  /* =========================================================
     SECTION + QUESTION MODEL
     w: weight  3 = critical (counted as a gap if empty)
                2 = important (counts toward completeness)
                1 = optional  (not counted)
     t: array of build-type ids it applies to, or null = all
     ========================================================= */
  var SECTIONS = [
    {
      id: "foundation", title: "Foundation",
      principle: "Everything downstream is calibrated against this. If the model can't tell what “good” looks like or what's at stake, it will pick a reasonable-looking answer that may not be the one you need.",
      questions: [
        { id: "name", w: 3, label: "Name it, in one sentence.",
          help: "A crisp identity keeps every later answer consistent — and becomes the title of the prompt.",
          ph: "“ReleaseNote Writer” — turns a list of merged pull requests into a customer-facing changelog." },
        { id: "problem", w: 3, label: "What problem does this solve, and for whom? What happens today without it?",
          help: "Stakes and status quo tell the model how much care and effort the job deserves.",
          ph: "Our developer-relations team hand-writes release notes every fortnight. It takes ~2 hours and details get missed. Readers are external developers integrating our API." },
        { id: "success", w: 3, label: "Describe a successful result concretely. How will you check it worked?",
          help: "An explicit, checkable definition of done is the biggest single reducer of iteration.",
          ph: "Lists every user-facing change, grouped as Added / Changed / Fixed, no internal ticket numbers or code names, under 200 words. I spot-check that 5 sample PRs are each represented." },
        { id: "failure", w: 2, label: "What would make a result unacceptable or embarrassing? Name the failure modes you fear.",
          help: "Naming anti-goals lets the model actively steer around them.",
          ph: "Inventing a change that isn't in the input. Leaking an internal service name. Burying a breaking change in the middle of a paragraph." }
      ],
      overlook: [
        "A definition of done you could hand to a stranger with no other context.",
        "The cost of a wrong answer — it sets how cautious the model should be.",
        "Whether “there is no good answer” is itself an acceptable, expected output."
      ]
    },
    {
      id: "role", title: "Role & framing",
      principle: "“You are X” shifts the model's whole distribution of responses — vocabulary, assumptions, what it treats as obvious. Pick the role whose judgement you actually want to borrow.",
      questions: [
        { id: "role", w: 2, label: "What role and expertise should the model adopt? Whose judgement should it emulate?",
          help: "Include seniority and domain, not just a job title.",
          ph: "A senior technical writer who has shipped developer documentation for a decade and reviews every changelog before it ships." },
        { id: "optimize", w: 2, label: "What should it optimise for when goals compete?",
          help: "Every non-trivial task has trade-offs. Say which way to lean before the model has to guess.",

  /* =========================================================
     STATE
     ========================================================= */
  var state = {
    view: "intro",      // "intro" | "builder"
    buildType: null,
    sectionIndex: 0,
    answers: {}
  };

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && typeof d === "object") {
        state.buildType = d.buildType || null;
        state.answers = d.answers || {};
        if (state.buildType) { state.view = "builder"; state.sectionIndex = d.sectionIndex || 0; }
      }
    } catch (e) { /* ignore */ }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        buildType: state.buildType,
        answers: state.answers,
        sectionIndex: state.sectionIndex,
        savedAt: new Date().toISOString()
      }));
    } catch (e) { /* ignore */ }
  }

  /* =========================================================
     HELPERS
     ========================================================= */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (k.slice(0, 5) === "aria-") n.setAttribute(k, String(attrs[k]));
      else if (attrs[k] === true) n.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function visibleSections() {
    return SECTIONS.filter(function (s) { return sectionQuestions(s).length > 0; });
  }
  function sectionQuestions(s) {
    return s.questions.filter(function (q) {
      return !q.t || q.t.indexOf(state.buildType) !== -1;
    });
  }
  function ans(id) { return (state.answers[id] || "").trim(); }
  function isFilled(id) { return ans(id).length >= 12; }

  function sectionScore(s) {
    var qs = sectionQuestions(s).filter(function (q) { return q.w >= 2; });
    var done = qs.filter(function (q) { return isFilled(q.id); }).length;
    return { done: done, total: qs.length };
  }
  function overallPct() {
    var t = 0, d = 0;
    visibleSections().forEach(function (s) {
      sectionQuestions(s).forEach(function (q) {
        if (q.w >= 2) { t++; if (isFilled(q.id)) d++; }
      });
    });
    return t ? Math.round((d / t) * 100) : 0;
  }
  function gaps() {
    var out = [];
    visibleSections().forEach(function (s) {
      sectionQuestions(s).forEach(function (q) {
        if (q.w === 3 && !isFilled(q.id)) out.push({ section: s.title, label: q.label, help: q.help });
      });
    });
    return out;
  }

  /* =========================================================
     RENDER: INTRO
     ========================================================= */
  var root = document.getElementById("root");

  function render() {
    root.innerHTML = "";
    document.getElementById("btnMethod").hidden = state.view !== "builder";
    if (state.view === "intro") root.appendChild(renderIntro());
    else root.appendChild(renderBuilder());
  }

  function renderIntro() {
    var wrap = el("div", { class: "intro" });

    wrap.appendChild(el("p", { class: "intro-lede", html:
      "Most prompts get rewritten four or five times because the first version left the model to guess. " +
      "This bench walks you through the questions a capable teammate would ask before starting — " +
      "then writes them up as <strong>a prompt you can paste into a model</strong> and <strong>a spec you can keep and revise</strong>." }));

    var pr = el("div", { class: "principles" });
    PRINCIPLES.forEach(function (t, i) {
      pr.appendChild(el("div", { class: "principle" }, [
        el("div", { class: "n", text: String(i + 1).padStart(2, "0") }),
        el("p", { text: t })
      ]));
    });
    wrap.appendChild(pr);

    var pick = el("div", { class: "pick" });
    pick.appendChild(el("h2", { text: "1 · What are you building?" }));
    pick.appendChild(el("p", { class: "sub", text:
      "This changes which questions you'll be asked. You can switch later without losing answers." }));

    var grid = el("div", { class: "types" });
    TYPES.forEach(function (t) {
      grid.appendChild(el("button", {
        class: "type-card",
        "aria-pressed": state.buildType === t.id,
        onclick: function () { state.buildType = t.id; save(); render(); }
      }, [
        el("span", { class: "t-name", text: t.label }),
        el("span", { class: "t-blurb", text: t.blurb })
      ]));
    });
    pick.appendChild(grid);

    var row = el("div", { class: "start-row" });
    var start = el("button", {
      class: "btn primary",
      disabled: !state.buildType,
      onclick: function () {
        if (!state.buildType) return;
        state.view = "builder"; state.sectionIndex = 0; save(); render();
        window.scrollTo(0, 0);
      }
    }, [state.buildType ? "Start the brief →" : "Pick a type to begin"]);
    row.appendChild(start);
    if (Object.keys(state.answers).length) {
      row.appendChild(el("span", { class: "start-hint", text:
        "A saved draft is loaded — " + overallPct() + "% complete." }));
    }
    pick.appendChild(row);
    wrap.appendChild(pick);

    return wrap;
  }

  /* =========================================================
     RENDER: BUILDER
     ========================================================= */
  function renderBuilder() {
    var secs = visibleSections();
    if (state.sectionIndex >= secs.length) state.sectionIndex = secs.length - 1;
    var cur = secs[state.sectionIndex];

    var wrap = el("div", { class: "builder" });

    /* rail */
    var rail = el("nav", { class: "rail", "aria-label": "Sections" });
    rail.appendChild(el("div", { class: "rail-head", text: TYPES.filter(function(t){return t.id===state.buildType;})[0].label }));
    secs.forEach(function (s, i) {
      var sc = sectionScore(s);
      var full = sc.total > 0 && sc.done === sc.total;
      rail.appendChild(el("button", {
        class: "rail-item",
        "aria-current": i === state.sectionIndex,
        onclick: function () { state.sectionIndex = i; save(); render(); window.scrollTo(0, 0); }
      }, [
        el("span", { class: "ri-num", text: String(i + 1).padStart(2, "0") }),
        el("span", { class: "ri-title", text: s.title }),
        el("span", { class: "ri-meter" + (full ? " full" : ""), text: sc.total ? (sc.done + "/" + sc.total) : "–" })
      ]));
    });
    wrap.appendChild(rail);

    /* stage */
    var stage = el("main", { class: "stage" });
    stage.appendChild(el("div", { class: "section-head" }, [
      el("span", { class: "eyebrow", text: "Section " + (state.sectionIndex + 1) + " of " + secs.length }),
      el("h2", { text: cur.title })
    ]));
    stage.appendChild(el("div", { class: "principle-note", text: cur.principle }));

    sectionQuestions(cur).forEach(function (q) {
      var fid = "f_" + q.id;
      var field = el("div", { class: "field" + (isFilled(q.id) ? " filled" : "") });
      var lab = el("label", { for: fid }, [q.label]);
      lab.appendChild(el("span", {
        class: "req" + (q.w === 3 ? "" : " opt"),
        text: q.w === 3 ? "needed" : (q.w === 2 ? "recommended" : "optional")
      }));
      field.appendChild(lab);
      field.appendChild(el("div", { class: "help", text: q.help }));

      var seeded = state.answers[q.id];
      if (seeded == null && q.seed) seeded = q.seed;

      var ta = el("textarea", {
        id: fid, rows: 3, placeholder: q.ph || "",
        oninput: function (e) {
          state.answers[q.id] = e.target.value;
          field.classList.toggle("filled", isFilled(q.id));
          save();
          refreshMeters();
        }
      });
      ta.value = seeded || "";
      if (seeded && state.answers[q.id] == null) state.answers[q.id] = seeded;
      field.classList.toggle("filled", isFilled(q.id));
      field.appendChild(ta);
      stage.appendChild(field);
    });

    if (cur.overlook && cur.overlook.length) {
      var ov = el("aside", { class: "overlook" });
      ov.appendChild(el("h3", { text: "Easy to leave out" }));
      var ul = el("ul");
      cur.overlook.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      ov.appendChild(ul);
      stage.appendChild(ov);
    }
    wrap.appendChild(stage);

    /* footer */
    wrap.appendChild(renderFootbar(secs));
    return wrap;
  }

  function renderFootbar(secs) {
    var bar = el("div", { class: "footbar" });
    var inner = el("div", { class: "inner" });

    var mw = el("div", { class: "meter-wrap" });
    var track = el("div", { class: "meter-track" });
    var fill = el("div", { class: "meter-fill", id: "meterFill" });
    track.appendChild(fill);
    mw.appendChild(track);
    mw.appendChild(el("span", { class: "meter-num", id: "meterNum" }));
    inner.appendChild(mw);

    var navd = el("div", { class: "foot-nav" });
    navd.appendChild(el("button", {
      class: "btn", disabled: state.sectionIndex === 0,
      onclick: function () { if (state.sectionIndex > 0) { state.sectionIndex--; save(); render(); window.scrollTo(0, 0); } }
    }, ["← Back"]));
    if (state.sectionIndex < secs.length - 1) {
      navd.appendChild(el("button", {
        class: "btn",
        onclick: function () { state.sectionIndex++; save(); render(); window.scrollTo(0, 0); }
      }, ["Next →"]));
    }
    navd.appendChild(el("button", {
      class: "btn primary",
      onclick: openOutput
    }, ["Generate output"]));
    inner.appendChild(navd);

    bar.appendChild(inner);
    setTimeout(refreshMeters, 0);
    return bar;
  }

  function refreshMeters() {
    var pct = overallPct();
    var fill = document.getElementById("meterFill");
    var num = document.getElementById("meterNum");
    if (fill) { fill.style.width = pct + "%"; fill.classList.toggle("done", pct === 100); }
    if (num) num.textContent = pct + "% briefed";
    // rail meters
    var secs = visibleSections();
    document.querySelectorAll(".rail-item").forEach(function (item, i) {
      var m = item.querySelector(".ri-meter");
      if (!m || !secs[i]) return;
      var sc = sectionScore(secs[i]);
      m.textContent = sc.total ? (sc.done + "/" + sc.total) : "–";
      m.classList.toggle("full", sc.total > 0 && sc.done === sc.total);
    });
  }

  /* =========================================================
     OUTPUT GENERATION
     ========================================================= */
  function lines() {
    var a = [];
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) a.push(arguments[i]);
    return a.join("\n");
  }
  function listify(id) {
    var v = ans(id);
    if (!v) return "";
    var parts = v.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (parts.length <= 1) return v;
    return parts.map(function (s) { return "- " + s.replace(/^[-*•]\s+/, ""); }).join("\n");
  }
  function fenced(id) {
    var v = ans(id);
    if (!v) return "";
    return "```\n" + v + "\n```";
  }
  function snake(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

  function buildBlocks() {
    var t = state.buildType;
    var blocks = [];

    /* preamble (not a titled block) */
    var pre = [];
    if (ans("role")) pre.push("You are " + ans("role").replace(/\.$/, "") + ".");
    if (ans("optimize")) pre.push("When priorities compete, you optimise for: " + ans("optimize"));
    if (ans("voice")) pre.push("Voice and register: " + ans("voice"));
    var preamble = pre.join(" ");

    blocks.push(["Objective", lines(
      ans("problem") && ("Purpose: " + ans("problem")),
      ans("success") && ("Your output is correct when: " + ans("success")),
      ans("failure") && ("Actively avoid these failure modes:\n" + listify("failure"))
    )]);

    blocks.push(["Context", lines(
      ans("audience") && ("Audience: " + ans("audience")),
      ans("environment") && ("Where this runs: " + ans("environment")),
      ans("assumptions") && ("Assumptions: " + ans("assumptions"))
    )]);

    blocks.push(["Input", lines(
      ans("input_shape") && ("You will receive: " + ans("input_shape")),
      ans("input_quality") && ("Input reliability: " + ans("input_quality")),
      ans("injection") && (ans("injection")),
      ans("input_examples") && ("Example input(s):\n" + fenced("input_examples"))
    )]);

    /* core behaviour, per type */
    if (t === "assistant") {
      blocks.push(["Behaviour", lines(
        ans("convo_flow") && ("Conversation shape: " + ans("convo_flow")),
        ans("ask_first") && ("Establish before helping: " + ans("ask_first")),
        ans("always_do") && ("Always:\n" + listify("always_do")),
        ans("never_do") && ("Never:\n" + listify("never_do"))
      )]);
    } else if (t === "task") {
      blocks.push(["Task", lines(
        ans("transform_steps") && ("Perform this transformation, following the steps literally:\n" + listify("transform_steps")),
        ans("rules_of_thumb") && ("Judgement calls: " + ans("rules_of_thumb"))
      )]);
    } else if (t === "agent") {
      blocks.push(["Operating loop", lines(
        "Work in a loop: assess the current state, choose one next action, take it, observe the result, then repeat until the objective is met or a stop condition triggers.",
        ans("autonomy") && ("Autonomy — " + ans("autonomy")),
        ans("strategy") && ("Strategy — " + ans("strategy")),
        ans("progress") && ("Progress reporting — " + ans("progress"))
      )]);
    } else if (t === "workflow") {
      blocks.push(["Pipeline", lines(
        ans("stages") && ("Stages, in order:\n" + listify("stages")),
        ans("handoffs") && ("Hand-off contracts: " + ans("handoffs"))
      )]);
    }

    if (t === "agent" || t === "workflow") {
      blocks.push(["Tools", lines(
        ans("tools_list") && ("Available tools:\n" + listify("tools_list")),
        ans("tool_when") && ("Tool usage guidance: " + ans("tool_when")),
        ans("permissions") && ("Permission boundaries: " + ans("permissions")),
        ans("budgets") && ("Budgets and stop conditions: " + ans("budgets")),
        ans("memory") && ("State to carry / drop: " + ans("memory"))
      )]);
    }

    blocks.push(["Constraints", lines(
      ans("hard_rules") && (listify("hard_rules")),
      ans("out_of_scope") && ("Out of scope: " + ans("out_of_scope")),
      ans("safety") && ("Sensitive content: " + ans("safety"))
    )]);

    blocks.push(["Output", lines(
      ans("format_skeleton") && ("Produce output in exactly this format:\n" + ans("format_skeleton")),
      ans("length_detail") && ("Length and detail: " + ans("length_detail")),
      ans("output_never") && ("The output must never contain: " + ans("output_never")),
      ans("output_examples") && ("Example of ideal output:\n" + fenced("output_examples"))
    )]);

    blocks.push(["Reasoning", lines(
      ans("deliberation") && (ans("deliberation")),
      ans("ambiguity") && ("When the request is ambiguous or under-specified: " + ans("ambiguity")),
      ans("precedence") && ("If instructions conflict, this is the precedence order: " + ans("precedence")),
      ans("uncertainty") && ("When you cannot verify something: " + ans("uncertainty"))
    )]);

    blocks.push(["Edge cases", lines(
      ans("edge_cases") && ("Handle these situations as follows:\n" + listify("edge_cases")),
      ans("on_error") && ("On error: " + ans("on_error")),
      ans("escalation") && ("Escalate to a human when: " + ans("escalation"))
    )]);

    blocks.push(["Reference examples", lines(
      ans("golden_pairs") && ("Match the style and decisions in these examples:\n" + fenced("golden_pairs"))
    )]);

    return { preamble: preamble, blocks: blocks };
  }

  function generatePrompt(fmt) {
    var name = ans("name") || "AI instruction";
    var data = buildBlocks();
    var head = fmt === "xml"
      ? "<task_name>" + name + "</task_name>"
      : "# " + name;
    var parts = [head];
    if (data.preamble) parts.push(data.preamble);
    data.blocks.forEach(function (b) {
      var title = b[0], body = b[1];
      if (!body || !body.trim()) return;
      if (fmt === "xml") {
        var tag = snake(title);
        parts.push("<" + tag + ">\n" + body + "\n</" + tag + ">");
      } else {
        parts.push("## " + title + "\n\n" + body);
      }
    });
    return parts.join("\n\n") + "\n";
  }

  function generateSpec() {
    var name = ans("name") || "(unnamed)";
    var typeLabel = TYPES.filter(function (t) { return t.id === state.buildType; })[0].label;
    var pct = overallPct();
    var out = [];
    out.push("# Specification — " + name);
    out.push("");
    out.push("- Build type: " + typeLabel);
    out.push("- Completeness: " + pct + "%  (recommended fields answered)");
    out.push("- Generated: " + new Date().toISOString().slice(0, 10));
    out.push("");
    out.push("> How to use this: paste the generated **prompt** into your model as the system / developer");
    out.push("> instruction. Keep this **spec** in version control. When the output isn't right, change the");
    out.push("> spec first, regenerate the prompt, and note what you changed under section " +
      visibleSections().length + ".");
    out.push("");

    var n = 0;
    visibleSections().forEach(function (s) {
      var qs = sectionQuestions(s);
      var anyAnswered = qs.some(function (q) { return isFilled(q.id); });
      var anyGap = qs.some(function (q) { return q.w === 3 && !isFilled(q.id); });
      if (!anyAnswered && !anyGap) return;
      n++;
      out.push("## " + n + ". " + s.title);
      out.push("");
      qs.forEach(function (q) {
        if (isFilled(q.id)) {
          out.push("**" + stripTrail(q.label) + "**");
          out.push("");
          ans(q.id).split(/\r?\n/).forEach(function (ln) { out.push(ln.length ? ln : ""); });
          out.push("");
        } else if (q.w === 3) {
          out.push("> _Open question:_ " + stripTrail(q.label) + "  —  " + q.help);
          out.push("");
        }
      });
    });

    var g = gaps();
    out.push("## Open questions before this is ready");
    out.push("");
    if (!g.length) {
      out.push("None — every critical field is answered. Remaining polish is in the recommended fields.");
    } else {
      g.forEach(function (x) { out.push("- **" + x.section + ":** " + stripTrail(x.label)); });
    }
    out.push("");
    return out.join("\n");
  }
  function stripTrail(s) { return s.replace(/\s*[?.:]?\s*$/, ""); }

  /* =========================================================
     OUTPUT MODAL
     ========================================================= */
  var modalFmt = "md";
  var modalTab = "prompt";

  function openOutput() {
    var scrim = el("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) closeOutput(); } });
    var modal = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Generated output" });

    var header = el("header");
    header.appendChild(el("h2", { text: "Your instruction set" }));
    var tabs = el("div", { class: "tabs" });
    tabs.appendChild(tabBtn("prompt", "Prompt"));
    tabs.appendChild(tabBtn("spec", "Spec doc"));
    header.appendChild(tabs);
    header.appendChild(el("button", { class: "btn ghost", onclick: closeOutput }, ["Close ✕"]));
    modal.appendChild(header);

    var body = el("div", { class: "modal-body", id: "modalBody" });
    modal.appendChild(body);
    scrim.appendChild(modal);
    document.body.appendChild(scrim);
    state._scrim = scrim;
    document.addEventListener("keydown", escClose);
    paintModal();
  }
  function escClose(e) { if (e.key === "Escape") closeOutput(); }
  function closeOutput() {
    if (state._scrim) { state._scrim.remove(); state._scrim = null; }
    document.removeEventListener("keydown", escClose);
  }
  function tabBtn(id, label) {
    return el("button", {
      class: "tab", role: "tab", "data-tab": id, "aria-selected": modalTab === id,
      onclick: function () { modalTab = id; paintModal(); }
    }, [label]);
  }

  function paintModal() {
    var body = document.getElementById("modalBody");
    if (!body) return;
    body.innerHTML = "";
    document.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", t.getAttribute("data-tab") === modalTab ? "true" : "false");
    });

    // gaps summary
    var g = gaps();
    var gbox = el("div", { class: "gaps" + (g.length ? "" : " clear") });
    gbox.appendChild(el("h3", { text: g.length ? (g.length + " critical field" + (g.length > 1 ? "s" : "") + " still open") : "All critical fields answered" }));
    if (g.length) {
      var ul = el("ul");
      g.forEach(function (x) {
        ul.appendChild(el("li", {}, [el("b", { text: x.section + ": " }), stripTrail(x.label)]));
      });
      gbox.appendChild(ul);
      gbox.appendChild(el("p", { class: "help", text:
        "You can still export now — the prompt just leaves these to the model's discretion." }));
    } else {
      gbox.appendChild(el("p", { class: "help", text:
        "Fill the remaining recommended fields for extra precision, or export as is." }));
    }
    body.appendChild(gbox);

    var text = modalTab === "prompt" ? generatePrompt(modalFmt) : generateSpec();

    // toolbar
    var tb = el("div", { class: "out-toolbar" });
    if (modalTab === "prompt") {
      var seg = el("div", { class: "seg" });
      seg.appendChild(el("button", {
        "aria-pressed": modalFmt === "md",
        onclick: function () { modalFmt = "md"; paintModal(); }
      }, ["Markdown headings"]));
      seg.appendChild(el("button", {
        "aria-pressed": modalFmt === "xml",
        onclick: function () { modalFmt = "xml"; paintModal(); }
      }, ["XML tags"]));
      tb.appendChild(seg);
    }
    var copyBtn = el("button", { class: "btn primary" }, ["Copy " + (modalTab === "prompt" ? "prompt" : "spec")]);
    var copiedMsg = el("span", { class: "copied", text: "" });
    copyBtn.addEventListener("click", function () {
      copyText(text, function (ok) {
        copiedMsg.textContent = ok ? "✓ copied to clipboard" : "select the text below and copy manually";
        setTimeout(function () { copiedMsg.textContent = ""; }, 3000);
      });
    });
    tb.appendChild(copyBtn);
    var dl = el("button", { class: "btn" }, ["Download ." + (modalTab === "prompt" ? "md" : "md")]);
    dl.addEventListener("click", function () {
      downloadText((modalTab === "prompt" ? (snake(ans("name") || "prompt")) : (snake(ans("name") || "spec") + "-spec")) + ".md", text);
    });
    tb.appendChild(dl);
    tb.appendChild(copiedMsg);
    body.appendChild(tb);

    var pre = el("pre", { class: "out", tabindex: "0" });
    pre.textContent = text;
    body.appendChild(pre);
  }

  function copyText(t, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { cb(true); }, function () { cb(false); });
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        ta.remove(); cb(ok);
      } catch (e) { cb(false); }
    }
  }
  async function downloadText(name, t) {
    // Preferred path when running as a published Artifact: the host-mediated
    // save dialog. Falls back to a blob download for the standalone HTML file.
    var dl = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        dl = await window.claude.use("downloads");
      }
    } catch (e) { dl = null; }
    if (dl && typeof dl.save === "function") {
      try { await dl.save({ filename: name, data: t }); }
      catch (e) { /* declined / unavailable — nothing to do */ }
      return;
    }
    try {
      var blob = new Blob([t], { type: "text/markdown" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) { /* sandbox may block; copy still works */ }
  }

  /* =========================================================
     TOP-BAR ACTIONS
     ========================================================= */
  document.getElementById("btnTheme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "dark" :
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(STORE_KEY + ":theme", next); } catch (e) {}
  });
  (function initTheme() {
    try {
      var t = localStorage.getItem(STORE_KEY + ":theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();

  document.getElementById("btnMethod").addEventListener("click", function () {
    state.view = "intro"; render(); window.scrollTo(0, 0);
  });
  document.getElementById("btnSave").addEventListener("click", function () {
    save();
    downloadText("prompt-architect-draft.json", JSON.stringify({
      buildType: state.buildType, answers: state.answers, sectionIndex: state.sectionIndex,
      savedAt: new Date().toISOString(), tool: "Prompt Architect v1"
    }, null, 2));
  });
  document.getElementById("btnLoad").addEventListener("click", function () {
    document.getElementById("fileInput").click();
  });
  document.getElementById("fileInput").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        state.buildType = d.buildType || state.buildType;
        state.answers = d.answers || {};
        state.sectionIndex = d.sectionIndex || 0;
        state.view = state.buildType ? "builder" : "intro";
        save(); render(); window.scrollTo(0, 0);
      } catch (err) {
        alert("That file could not be read as a Prompt Architect draft.");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("Clear all answers and start over? Export a draft first if you want to keep this.")) return;
    state = { view: "intro", buildType: null, sectionIndex: 0, answers: {} };
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    render(); window.scrollTo(0, 0);
  });

  /* =========================================================
     BOOT
     ========================================================= */
  load();
  render();
})();
</script>
